<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "outline-variant": "#becbb1",
                            "inverse-surface": "#303030",
                            "on-surface": "#1b1c1c",
                            "on-surface-variant": "#3f4a36",
                            "error-container": "#ffdad6",
                            "on-tertiary-fixed": "#241a00",
                            "on-primary-fixed-variant": "#1f5100",
                            "surface-variant": "#e4e2e2",
                            "secondary": "#006590",
                            "tertiary-fixed-dim": "#f4bf00",
                            "background": "#fbf9f8",
                            "surface-container-low": "#f5f3f3",
                            "tertiary-fixed": "#ffdf92",
                            "on-primary": "#ffffff",
                            "on-secondary-fixed-variant": "#004c6e",
                            "error": "#ba1a1a",
                            "on-primary-fixed": "#082100",
                            "on-secondary-fixed": "#001e2e",
                            "on-background": "#1b1c1c",
                            "primary-fixed": "#87fe45",
                            "inverse-primary": "#6be026",
                            "tertiary-container": "#ddad00",
                            "surface-bright": "#fbf9f8",
                            "primary-fixed-dim": "#6be026",
                            "tertiary": "#755b00",
                            "on-tertiary-container": "#574300",
                            "on-tertiary": "#ffffff",
                            "surface-tint": "#2b6c00",
                            "on-error-container": "#93000a",
                            "surface-container": "#efeded",
                            "on-error": "#ffffff",
                            "on-tertiary-fixed-variant": "#594400",
                            "secondary-container": "#2fb8ff",
                            "primary": "#2b6c00",
                            "surface-dim": "#dbd9d9",
                            "surface-container-lowest": "#ffffff",
                            "primary-container": "#58cc02",
                            "on-primary-container": "#1e5000",
                            "on-secondary-container": "#004666",
                            "outline": "#6f7b64",
                            "inverse-on-surface": "#f2f0f0",
                            "on-secondary": "#ffffff",
                            "secondary-fixed": "#c8e6ff",
                            "surface": "#fbf9f8",
                            "secondary-fixed-dim": "#88ceff",
                            "surface-container-high": "#eae8e7",
                            "surface-container-highest": "#e4e2e2"
                    },
                    "borderRadius": {
                            "DEFAULT": "1rem",
                            "lg": "2rem",
                            "xl": "3rem",
                            "full": "9999px"
                    },
                    "fontFamily": {
                            "headline": ["Plus Jakarta Sans"],
                            "body": ["Plus Jakarta Sans"],
                            "label": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body pb-32 min-h-screen flex flex-col relative">
<!-- TopAppBar -->
<header class="docked full-width top-0 tonal-shift-bg-surface-container-low flat no-shadows bg-surface dark:bg-slate-950 flex justify-between items-center px-6 py-4 w-full max-w-full sticky z-40">
<button aria-label="Settings" class="text-primary dark:text-primary-container font-['Plus_Jakarta_Sans'] font-bold tracking-tight hover:opacity-80 transition-opacity active:translate-y-0.5 transition-all w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low" title="Settings"><span class="material-symbols-outlined" style="font-variation-settings: 'wght' 700;">settings</span></button>
<div class="flex items-center gap-4">
<!-- Streak Indicator -->
<div class="flex items-center gap-1.5 text-tertiary-fixed-dim font-headline font-extrabold text-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1, 'wght' 600;">local_fire_department</span>
<span>5</span>
</div>
<!-- XP Indicator (JSON Trailing Action) -->
<button class="flex items-center gap-1.5 text-primary dark:text-primary-container font-['Plus_Jakarta_Sans'] font-extrabold tracking-tight hover:opacity-80 transition-opacity active:translate-y-0.5 transition-all text-lg bg-surface-container-low px-3 py-1.5 rounded-xl">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1, 'wght' 700;">bolt</span>
<span>523</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-6 pt-6 flex flex-col gap-8 max-w-lg mx-auto w-full relative z-10">
<!-- Welcome Header -->
<section class="mt-2">
<h1 class="font-headline text-5xl font-extrabold tracking-[-0.03em] leading-[1.1] text-on-surface mb-3">Welcome back,<br/>Alex!</h1>
<p class="font-body text-on-surface-variant text-lg font-medium">Ready to smash your daily goals?</p>
</section>
<!-- Daily Task Card (Hero Component) -->
<section class="relative z-20">
<!-- Ambient Tinted Shadow -->
<div class="absolute inset-0 bg-on-surface/5 blur-[32px] translate-y-4 -z-10 rounded-xl"></div>
<div class="bg-surface-container-lowest rounded-xl p-6 border-b-[4px] border-surface-container-high flex flex-col gap-6">
<div class="flex justify-between items-end">
<div>
<h2 class="font-headline text-xl font-extrabold text-on-surface mb-1">Daily Quest</h2>
<p class="font-body text-sm text-on-surface-variant font-medium">Learn new vocabulary</p>
</div>
<div class="font-headline text-2xl font-black text-primary-container">
                        30<span class="text-on-surface-variant text-lg opacity-50">/50</span>
</div>
</div>
<!-- Chunky Progress Bar -->
<div class="bg-surface-container-highest h-5 rounded-full overflow-hidden relative shadow-inner">
<div class="bg-primary-container h-full w-[60%] rounded-full relative">
<div class="absolute top-1 bottom-1 left-2 right-2 bg-white/20 rounded-full"></div>
</div>
</div>
<!-- 3D Tactile Button (Primary Action) -->
<button class="w-full bg-primary-container text-white font-headline font-extrabold text-xl py-5 rounded-[20px] border-b-[8px] border-primary active:border-b-[2px] active:translate-y-[6px] transition-all flex items-center justify-center gap-2 mt-2 shadow-sm">
                    Continue Learning
                    <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1, 'wght' 700;">play_circle</span>
</button>
</div>
</section>
<!-- Quick Start Grid -->
<section class="mt-2">
<h3 class="font-headline text-xl font-bold mb-5 text-on-surface tracking-tight">Quick Start</h3>
<div class="grid grid-cols-2 gap-5">
<!-- 5 Words Button -->
<button class="bg-surface-container-lowest rounded-xl p-6 border-b-[6px] border-surface-container-high active:border-b-[2px] active:translate-y-[4px] transition-all flex flex-col items-center justify-center gap-4 relative group">
<div class="absolute inset-0 bg-secondary/5 blur-[20px] opacity-0 group-hover:opacity-100 transition-opacity rounded-xl"></div>
<div class="w-16 h-16 rounded-full bg-secondary-fixed flex items-center justify-center text-secondary relative z-10 shadow-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<span class="font-headline font-extrabold text-lg text-on-surface relative z-10">5 Words</span>
</button>
<!-- 10 Words Button -->
<button class="bg-surface-container-lowest rounded-xl p-6 border-b-[6px] border-surface-container-high active:border-b-[2px] active:translate-y-[4px] transition-all flex flex-col items-center justify-center gap-4 relative group">
<div class="absolute inset-0 bg-tertiary/5 blur-[20px] opacity-0 group-hover:opacity-100 transition-opacity rounded-xl"></div>
<div class="w-16 h-16 rounded-full bg-tertiary-fixed flex items-center justify-center text-tertiary relative z-10 shadow-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">speed</span>
</div>
<span class="font-headline font-extrabold text-lg text-on-surface relative z-10">10 Words</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-surface/90 dark:bg-slate-900/90 backdrop-blur-2xl text-on-surface-variant font-['Plus_Jakarta_Sans'] text-[11px] font-bold uppercase tracking-wider rounded-t-[32px] shadow-[0_-8px_32px_rgba(0,0,0,0.05)]">
<!-- Active: Learn (Home) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-2xl px-4 py-2 shadow-[0_4px_0_0_#2b6c00] translate-y-[-4px] active:translate-y-0 active:shadow-none transition-all duration-100">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">school</span>
<span>Learn</span>
</button>
<!-- Inactive: Leaderboard -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-high rounded-2xl active:translate-y-0 active:shadow-none transition-all duration-100 group">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform">leaderboard</span>
<span>Leaderboard</span>
</button>
<!-- Inactive: Quests -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-high rounded-2xl active:translate-y-0 active:shadow-none transition-all duration-100 group">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform">military_tech</span>
<span>Quests</span>
</button>
<!-- Inactive: Profile -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-high rounded-2xl active:translate-y-0 active:shadow-none transition-all duration-100 group">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:scale-110 transition-transform">person</span>
<span>Profile</span>
</button>
</nav>
</body></html>
