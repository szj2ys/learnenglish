<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Result Screen</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#becbb1",
                        "inverse-surface": "#303030",
                        "on-surface": "#1b1c1c",
                        "on-surface-variant": "#3f4a36",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#241a00",
                        "on-primary-fixed-variant": "#1f5100",
                        "surface-variant": "#e4e2e2",
                        "secondary": "#006590",
                        "tertiary-fixed-dim": "#f4bf00",
                        "background": "#fbf9f8",
                        "surface-container-low": "#f5f3f3",
                        "tertiary-fixed": "#ffdf92",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#004c6e",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#082100",
                        "on-secondary-fixed": "#001e2e",
                        "on-background": "#1b1c1c",
                        "primary-fixed": "#87fe45",
                        "inverse-primary": "#6be026",
                        "tertiary-container": "#ddad00",
                        "surface-bright": "#fbf9f8",
                        "primary-fixed-dim": "#6be026",
                        "tertiary": "#755b00",
                        "on-tertiary-container": "#574300",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#2b6c00",
                        "on-error-container": "#93000a",
                        "surface-container": "#efeded",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#594400",
                        "secondary-container": "#2fb8ff",
                        "primary": "#2b6c00",
                        "surface-dim": "#dbd9d9",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#58cc02",
                        "on-primary-container": "#1e5000",
                        "on-secondary-container": "#004666",
                        "outline": "#6f7b64",
                        "inverse-on-surface": "#f2f0f0",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#c8e6ff",
                        "surface": "#fbf9f8",
                        "secondary-fixed-dim": "#88ceff",
                        "surface-container-high": "#eae8e7",
                        "surface-container-highest": "#e4e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Layer -->
<div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-primary-fixed/20 via-surface to-surface -z-10 pointer-events-none"></div>
<!-- TopAppBar -->
<header class="bg-transparent text-primary font-['Plus_Jakarta_Sans'] font-bold tracking-tight docked full-width top-0 flat no-shadows flex justify-between items-center px-6 py-4 w-full max-w-full z-10 relative">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:translate-y-0.5 transition-all w-10 h-10 flex items-center justify-center bg-surface-container-lowest rounded-full shadow-[0_4px_16px_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 600;">close</span>
</button>
<!-- Empty Brand Logo for Result Screen -->
<div class="text-primary font-black text-xl"></div>
<div class="flex items-center space-x-1.5 hover:opacity-80 transition-opacity active:translate-y-0.5 transition-all bg-surface-container-lowest px-4 py-2 rounded-full shadow-[0_4px_16px_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-xl" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="text-tertiary font-extrabold text-sm mt-0.5">523</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-md mx-auto flex flex-col pt-8 pb-6 px-6">
<!-- Celebration Section -->
<section class="flex flex-col items-center justify-center flex-1 w-full">
<div class="relative w-48 h-48 mb-8 group">
<!-- Ambient shadow for mascot -->
<div class="absolute inset-4 bg-primary rounded-full blur-[32px] opacity-20 group-hover:scale-110 transition-transform duration-500"></div>
<img class="relative w-full h-full object-cover rounded-full shadow-[0_16px_32px_rgba(43,108,0,0.15)] border-4 border-surface-container-lowest z-10" data-alt="3D rendered cute green owl mascot character holding a golden trophy surrounded by floating colorful confetti against a soft studio backdrop" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDt8Dd54OMTQxf0N511wB9qJSro1WdEuzCA-IyrBd7rpbJsD-C2NV1E8r_nLU9AxIQPhShYQJfHNtE_VTfQiwW0IJVtu4Y96LHWlA4MNZfHKFs8AfRKjlLk4dY18Tk2MGH1rz_PSzHAlKI20pj-LxZMmm0YrofqTduwfJ5OpK8ZB2O8MZ8wAL6m-k9ewDaMAkLfBraptO8sQWFn8l7t7H4qXi8lQ1DsLeLXHZYhzvBZ3C0Aron1ZSKWSFcChZiDibJV6B17ZjdxMeJz"/>
</div>
<h1 class="font-headline text-5xl font-black text-center text-primary tracking-tight mb-2">
                Well Done!
            </h1>
<p class="font-body text-on-surface-variant text-center font-medium text-lg">
                You crushed today's dictation.
            </p>
<!-- Stats Summary (Bento Grid Style) -->
<div class="flex gap-4 w-full mt-10">
<!-- Accuracy Card -->
<div class="flex-1 bg-surface-container-lowest rounded-xl p-5 flex flex-col items-center justify-center relative shadow-[0_8px_24px_rgba(0,0,0,0.04)] overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-secondary-container to-secondary"></div>
<div class="w-12 h-12 rounded-full bg-secondary-fixed text-secondary flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 600;">check_circle</span>
</div>
<span class="font-headline text-3xl font-extrabold text-on-surface tracking-tight">80%</span>
<span class="font-body text-xs uppercase tracking-widest font-bold text-on-surface-variant mt-1">Accuracy</span>
</div>
<!-- XP Card -->
<div class="flex-1 bg-surface-container-lowest rounded-xl p-5 flex flex-col items-center justify-center relative shadow-[0_8px_24px_rgba(0,0,0,0.04)] overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-tertiary-fixed-dim to-tertiary"></div>
<div class="w-12 h-12 rounded-full bg-tertiary-fixed text-tertiary flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1, 'wght' 600;">stars</span>
</div>
<span class="font-headline text-3xl font-extrabold text-tertiary tracking-tight">+120</span>
<span class="font-body text-xs uppercase tracking-widest font-bold text-on-surface-variant mt-1">XP Earned</span>
</div>
</div>
</section>
<!-- Actions (Bottom Anchored) -->
<section class="w-full mt-12 flex flex-col gap-4">
<!-- Primary Action -->
<button class="w-full relative flex items-center justify-center bg-primary-container text-on-primary-container font-headline font-extrabold tracking-wide text-lg py-4 px-6 rounded-xl shadow-[0_6px_0_0_#2b6c00] active:shadow-[0_0px_0_0_#2b6c00] active:translate-y-1.5 transition-all duration-150 gap-2">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                Play Again
            </button>
<!-- Secondary Action -->
<button class="w-full relative flex items-center justify-center bg-secondary-fixed text-on-secondary-container font-headline font-bold text-base py-4 px-6 rounded-xl shadow-[0_4px_0_0_#006590] active:shadow-[0_0px_0_0_#006590] active:translate-y-1 transition-all duration-150 gap-2 mt-2">
<span class="material-symbols-outlined text-xl">assignment_late</span>
                Review Mistakes
            </button>
</section>
</main>
</body></html>
